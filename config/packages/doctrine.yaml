cli.config:
  # namespace for doctrine connection class (for doctrine console)
  namespace:
    - \Infrastructure\Identity\IdentityDB
    - \Infrastructure\Resource\AppDB

# config/packages/doctrine.yaml
doctrine:
  dbal:
    types:
    #      uuid: Ramsey\Uuid\Doctrine\UuidType
    default_connection: default
    connections:
      #template for params
      default:
        driver: '%env(DB_CONNECTION)%'
        host: '%env(DB_HOST)%'
        port: '%env(DB_PORT)%'
        dbname: '%env(DB_NAME)%'
        user: '%env(DB_USERNAME)%'
        password: '%env(DB_PASSWORD)%'
        charset: ~
        path: ~
        memory: ~
        # The unix socket to use for MySQL
        unix_socket: ~
        # True to use as persistent connection for the ibm_db2 driver
        persistent: ~
        # The protocol to use for the ibm_db2 driver (default to TCPIP if omitted)
        protocol: ~
        # True to use dbname as service name instead of SID for Oracle
        service: ~
        # The session mode to use for the oci8 driver
        sessionMode: ~
        # True to use a pooled server with the oci8 driver
        pooled: ~
        # --- Pool (read by Spatial\Entity\DbConnection) ---
        # Max EntityManagers per pool, PER WORKER PROCESS. Total connections to
        # the database server are: worker_num x pools per service x poolSize.
        # Keep worker_num explicit in public/index.php and size this against the
        # server's max_connections, counting every service that shares it.
        poolSize: 5
        # Seconds a request waits for a free slot before failing with 503
        # instead of blocking the coroutine indefinitely.
        connectionDelay: 2
        # Issue `SELECT 1` on checkout. Catches connections dropped server-side
        # (idle timeout, failover, restart) at the cost of one round trip per
        # checkout. isOpen() is always checked regardless.
        validateOnCheckout: false

        # --- OpsWay Swoole PgSQL driver (optional) ---
        # The four keys below plus `retry` are only honoured when driverClass is
        # set to the OpsWay driver, which pools at the DBAL layer. Leave it
        # commented out and they have no effect.
        # driverClass: \OpsWay\Doctrine\DBAL\Swoole\PgSQL\Driver
        tickFrequency: 60000 # how often to check whether idle connections can be closed
        connectionTtl: 60 # close a connection unused for this long (seconds)
        usedTimes: 100 # retire a connection after this many queries
        useConnectionPool: true # if false, connect per request instead of pooling
        retry:
            maxAttempts: 2 # re-connect attempts when a pooled connection timed out
            delay: 1000 # delay before retrying the pool (milliseconds)


      #galaxyIdentity
      identity:
        driver: '%env(DB_CONNECTION)%'
        host: '%env(DB_HOST)%'
        port: '%env(DB_PORT)%'
        dbname: '%env(DB_NAME_IDENTITY)%'
        user: '%env(DB_USERNAME)%'
        password: '%env(DB_PASSWORD)%'
        charset: ~
        path: ~
        memory: ~
        # The unix socket to use for MySQL
        unix_socket: ~
        # True to use as persistent connection for the ibm_db2 driver
        persistent: ~
        # The protocol to use for the ibm_db2 driver (default to TCPIP if omitted)
        protocol: ~
        # True to use dbname as service name instead of SID for Oracle
        service: ~
        # The session mode to use for the oci8 driver
        sessionMode: ~
        # True to use a pooled server with the oci8 driver
        pooled: ~
        # See the `default` connection above for what each pool key does.
        # This is a SECOND pool: its poolSize adds to the per-worker total.
        poolSize: 5
        connectionDelay: 2
        validateOnCheckout: false
        # driverClass: \OpsWay\Doctrine\DBAL\Swoole\PgSQL\Driver
        tickFrequency: 60000
        connectionTtl: 60
        usedTimes: 100
        useConnectionPool: true
        retry:
            maxAttempts: 2
            delay: 1000

  orm:
    auto-generate_proxy_classes: true
    proxy_namespace: Proxies
    proxy_dir: '/var/cache/dev/doctrine/orm/Proxies'
    default_entity_manager: default
    metadata_driver_implementation: attribute
    metadata_cache_driver: redis
    query_cache_driver: redis
    result_cache_driver: redis
    #comment if you don't need these custom functions in your dql
    dql:
      datetime_functions:
        date: Oro\ORM\Query\AST\Functions\SimpleFunction
        time: Oro\ORM\Query\AST\Functions\SimpleFunction
        timestamp: Oro\ORM\Query\AST\Functions\SimpleFunction
        convert_tz: Oro\ORM\Query\AST\Functions\DateTime\ConvertTz
      numeric_functions:
        timestampdiff: Oro\ORM\Query\AST\Functions\Numeric\TimestampDiff
        dayofyear: Oro\ORM\Query\AST\Functions\SimpleFunction
        dayofmonth: Oro\ORM\Query\AST\Functions\SimpleFunction
        dayofweek: Oro\ORM\Query\AST\Functions\SimpleFunction
        week: Oro\ORM\Query\AST\Functions\SimpleFunction
        day: Oro\ORM\Query\AST\Functions\SimpleFunction
        hour: Oro\ORM\Query\AST\Functions\SimpleFunction
        minute: Oro\ORM\Query\AST\Functions\SimpleFunction
        month: Oro\ORM\Query\AST\Functions\SimpleFunction
        quarter: Oro\ORM\Query\AST\Functions\SimpleFunction
        second: Oro\ORM\Query\AST\Functions\SimpleFunction
        year: Oro\ORM\Query\AST\Functions\SimpleFunction
        sign: Oro\ORM\Query\AST\Functions\Numeric\Sign
        pow: Oro\ORM\Query\AST\Functions\Numeric\Pow
        round: Oro\ORM\Query\AST\Functions\Numeric\Round
        ceil: Oro\ORM\Query\AST\Functions\SimpleFunction
      string_functions:
        md5: Oro\ORM\Query\AST\Functions\SimpleFunction
        group_concat: Oro\ORM\Query\AST\Functions\String\GroupConcat
        concat_ws: Oro\ORM\Query\AST\Functions\String\ConcatWs
        cast: Oro\ORM\Query\AST\Functions\Cast
        replace: Oro\ORM\Query\AST\Functions\String\Replace
        date_format: Oro\ORM\Query\AST\Functions\String\DateFormat




    # php bin/doctrine list    //list all doctrine commands

    # php bin/doctrine orm:schema-tool:update  // update database tables

    # php bin/doctrine orm:generate-proxies  // generate proxy files
